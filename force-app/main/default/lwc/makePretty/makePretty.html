<template>
  <lightning-card
    title={resolvedCardTitle}
    icon-name={resolvedIconName}
    class={cardClass}
  >
    <div class="slds-var-p-horizontal_medium">
      <div class={formElementClass}>
        <label class="slds-form-element__label" for="source-input"
          >{resolvedFieldLabel}</label
        >
        <div class="slds-form-element__control">
          <textarea
            id="source-input"
            class="slds-textarea source-input"
            placeholder={resolvedPlaceholder}
            spellcheck="false"
            lwc:ref="sourceInput"
            oninput={handleInput}
          ></textarea>
        </div>
        <template lwc:if={errorMessage}>
          <div class="slds-form-element__help" role="alert">{errorMessage}</div>
        </template>
      </div>

      <div class="slds-text-align_center slds-var-m-top_small">
        <lightning-button
          class="slds-var-m-right_x-small"
          variant="brand"
          label={resolvedPrettifyLabel}
          onclick={handlePrettify}
          disabled={isEmpty}
        ></lightning-button>
        <lightning-button
          variant="brand"
          label={resolvedDecodeLabel}
          onclick={handleDecode}
          disabled={isEmpty}
        ></lightning-button>
      </div>
    </div>
  </lightning-card>
</template>
